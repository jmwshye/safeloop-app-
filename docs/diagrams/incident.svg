<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title description">
  <title id="title">충격 감지부터 긴급 대응 완료까지</title>
  <desc id="description">충격 감지 후 15초 동안 버튼이나 음성으로 본인 확인. 이때 괜찮다고 답하면 종료. 도움 요청이나 무응답이면 근무 중인 지정 동료와 반장에게 호출. 직접 도움 요청은 본인 확인을 건너뜀. 수락자가 없으면 30초마다 같은 구역 동료 한 명씩 추가. 한 명이 수락하면 현장 도착, 상태 관찰, 종료 사유 저장 순서. 119 버튼은 전화 화면을 열고 통화는 사용자가 직접 연결.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8392a2"/>
    </marker>
  </defs>
  <rect width="1120" height="520" rx="18" fill="#101215"/>
  <g fill="none" stroke="#8392a2" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M246 72 H362"/>
    <path d="M606 72 H817"/>
    <path d="M484 111 V184"/>
    <path d="M246 227 H362"/>
    <path d="M606 227 H817"/>
    <path d="M484 266 V338"/>
    <path d="M362 377 H246"/>
    <path d="M606 377 H696 Q708 377 708 365 V259 Q708 247 720 247 H817"/>
    <path d="M952 266 V338"/>
  </g>
  <g fill="#1d2229" stroke="#39424e" stroke-width="1.3">
    <rect x="32" y="33" width="214" height="78" rx="12"/>
    <rect x="362" y="33" width="244" height="78" rx="12"/>
    <rect x="32" y="188" width="214" height="78" rx="12"/>
    <rect x="362" y="188" width="244" height="78" rx="12"/>
    <rect x="817" y="188" width="270" height="78" rx="12"/>
    <rect x="362" y="338" width="244" height="78" rx="12"/>
    <rect x="32" y="338" width="214" height="78" rx="12"/>
  </g>
  <g fill="#18342b" stroke="#396956" stroke-width="1.3">
    <rect x="817" y="33" width="270" height="78" rx="12"/>
    <rect x="817" y="338" width="270" height="78" rx="12"/>
  </g>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <g text-anchor="middle" fill="#e4e9ef" font-size="20" font-weight="600">
      <text x="139" y="69">강한 충격 감지</text>
      <text x="484" y="69">15초 본인 확인</text>
      <text x="952" y="69" fill="#b8f0d7">사건 종료</text>
      <text x="139" y="224">직접 도움 요청</text>
      <text x="484" y="224">지정 동료·반장 호출</text>
      <text x="952" y="224">도착 후 상태 관찰</text>
      <text x="484" y="374">같은 구역 동료 호출</text>
      <text x="139" y="374">추가 후보 없음</text>
      <text x="952" y="374" fill="#b8f0d7">대응 완료</text>
    </g>
    <g text-anchor="middle" fill="#a9b3bd" font-size="15">
      <text x="139" y="93">근무 중 움직임 감시</text>
      <text x="484" y="93">버튼 또는 음성 응답</text>
      <text x="952" y="93">본인의 안전 응답 기록</text>
      <text x="139" y="248">본인 확인 없이 즉시 호출</text>
      <text x="484" y="248">지정 동료는 근무 중일 때</text>
      <text x="952" y="248">반장에게 관찰 결과 알림</text>
      <text x="484" y="398">30초마다 한 명씩 추가</text>
      <text x="139" y="398">기존 초대는 수락 가능</text>
      <text x="952" y="398">종료 사유 저장 · 사진 선택</text>
    </g>
    <g fill="#c1cad3" font-size="15">
      <text x="711" y="58" text-anchor="middle">15초 안에 “괜찮아요”</text>
      <text x="499" y="155">도움 요청 또는 무응답</text>
      <text x="711" y="213" text-anchor="middle">한 명 수락</text>
      <text x="499" y="306">수락자 없음</text>
      <text x="721" y="318">수락</text>
    </g>
    <path d="M32 447 H1087" stroke="#39424e" stroke-width="1"/>
    <g font-size="15">
      <text x="32" y="482" fill="#e4e9ef" font-weight="600">확인 지연</text>
      <text x="113" y="482" fill="#a9b3bd">수락 후 120초 동안 관찰 기록이 없으면 반장에게 한 번 알림</text>
      <text x="648" y="482" fill="#e4e9ef" font-weight="600">119 버튼</text>
      <text x="730" y="482" fill="#a9b3bd">전화 화면 열림을 기록 · 통화는 직접 연결</text>
    </g>
  </g>
</svg>
