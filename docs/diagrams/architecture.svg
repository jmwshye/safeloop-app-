      <path d="M648 167 V63 Q648 55 640 55 H507" marker-end="url(#arrow)"/>
      <path d="M308 55 H130 Q122 55 122 63 V122" marker-end="url(#arrow)"/>
    </g>
    <g fill="#1d2229" stroke="#39424e" stroke-width="1.3">
      <rect x="32" y="128" width="180" height="78" rx="12"/>
      <rect x="32" y="236" width="180" height="78" rx="12"/>
      <rect x="345" y="170" width="156" height="88" rx="12"/>
      <rect x="564" y="170" width="160" height="88" rx="12"/>
      <rect x="309" y="24" width="192" height="62" rx="12"/>
    </g>
    <path d="M822 179 C822 153 980 153 980 179 V247 C980 273 822 273 822 247 Z" fill="#18342b" stroke="#396956" stroke-width="1.3"/>
    <ellipse cx="901" cy="179" rx="79" ry="17" fill="#18342b" stroke="#396956" stroke-width="1.3"/>
    <g fill="#e4e9ef" font-size="22" font-weight="600" text-anchor="middle">
      <text x="122" y="163">작업자 앱</text>
      <text x="122" y="271">관리자 웹</text>
      <text x="423" y="207">Nginx</text>
      <text x="644" y="207">NestJS</text>
      <text x="901" y="222" fill="#b8f0d7">PostgreSQL</text>
      <text x="405" y="63">FCM</text>
    </g>
    <g fill="#a9b3bd" font-size="15" text-anchor="middle">
      <text x="122" y="189">근무·안전 기록 입력</text>
      <text x="122" y="297">현장 조회·조치</text>
      <text x="423" y="238">HTTPS 요청 전달</text>
      <text x="644" y="238">앱·웹 공용 API</text>
