<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="415" viewBox="0 0 1040 415" role="img" aria-labelledby="title desc">
  <title id="title">작업자 앱과 관리자 웹의 공용 API 연결 구조</title>
  <desc id="desc">공용 서버 구성. 작업자 앱과 관리자 웹 → HTTPS → Nginx → NestJS. 근무·안전 기록은 Drizzle을 거쳐 PostgreSQL에 저장. 푸시는 NestJS → FCM → 작업자 앱. 체험 기록과 상황 영상은 폰에만 저장.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#697b8e"/>
    </marker>
  </defs>
  <rect width="1040" height="415" rx="18" fill="#101215"/>
  <rect x="320" y="103" width="689" height="217" rx="14" fill="#14171b" stroke="#303842" stroke-width="1.3"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <text x="342" y="136" font-size="16" fill="#a9b3bd">공용 서버 구성 · AWS EC2 서울</text>
    <g fill="none" stroke="#697b8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M215 167 H251 Q259 167 259 175 V214"/>
      <path d="M215 275 H251 Q259 275 259 267 V214"/>
