<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="344" viewBox="0 0 1040 344" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">작업 전 안전점검 3항목</title>
  <desc id="desc">출근 후 추락 위험 구역, 바닥·개구부·안전난간, 안전모·턱끈·안전대를 각각 확인·개선 필요·모름 중 하나로 응답. 세 항목 모두 확인이면 전 항목 확인, 다른 답을 포함하면 확인 필요. 최초 또는 변경 저장한 답에 모름이 있으면 반장에게 확인 요청.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#697b8e"/>
    </marker>
  </defs>
  <rect width="1040" height="344" rx="18" fill="#101215"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <g fill="none" stroke="#697b8e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M299 132 H353"/>
      <path d="M578 132 H612 Q624 132 624 120 V82 Q624 70 636 70 H674"/>
      <path d="M578 132 H612 Q624 132 624 144 V173 Q624 185 636 185 H674"/>
