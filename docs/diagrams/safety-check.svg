      <rect x="674" y="267" width="336" height="48" rx="12"/>
    </g>
    <rect x="674" y="33" width="336" height="74" rx="12" fill="#18342b" stroke="#396956" stroke-width="1.3"/>
    <rect x="674" y="148" width="336" height="74" rx="12" fill="#352c20" stroke="#66533a" stroke-width="1.3"/>
    <g fill="#e4e9ef" font-size="20" font-weight="600">
      <text x="55" y="81">출근 후 본인 점검</text>
      <text x="465.5" y="124" text-anchor="middle">세 답변 저장</text>
    </g>
    <path d="M55 98 H273" stroke="#39424e"/>
    <g fill="#b2bcc7" font-size="16">
      <text x="55" y="127">1. 추락 위험 구역</text>
      <text x="55" y="162">2. 바닥·개구부·안전난간</text>
      <text x="55" y="197">3. 안전모·턱끈·안전대</text>
    </g>
    <g text-anchor="middle">
      <text x="465.5" y="153" fill="#b2bcc7" font-size="16">확인 · 개선 필요 · 모름</text>
      <text x="842" y="66" fill="#b8f0d7" font-size="20" font-weight="600">전 항목 확인</text>
      <text x="842" y="91" fill="#b2bcc7" font-size="15">세 답변 모두 ‘확인’</text>
      <text x="842" y="181" fill="#edc99a" font-size="20" font-weight="600">확인 필요</text>
      <text x="842" y="206" fill="#b2bcc7" font-size="15">‘개선 필요’ 또는 ‘모름’ 포함</text>
      <text x="842" y="298" fill="#e4e9ef" font-size="18" font-weight="500">반장에게 확인 요청</text>
