<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="342" viewBox="0 0 1040 342" role="img" aria-labelledby="title description">
  <title id="title">현장 참여부터 퇴근까지</title>
  <desc id="description">현장 참여 → 출근 저장 → 작업 전 점검 또는 건너뛰기 → 근무 시작. 도움 필요 시 긴급 호출, 위험 발견 시 신고·조치·재확인, 근무 종료 시 퇴근 기록 조회.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#738497"/>
    </marker>
  </defs>
  <rect width="1040" height="342" rx="18" fill="#101215"/>
  <g fill="none" stroke="#738497" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <g marker-end="url(#arrow)">
      <path d="M232 110 H278"/>
      <path d="M486 110 H532"/>
      <path d="M740 110 H786"/>
      <path d="M382 68 V44 Q382 36 390 36 H882 Q890 36 890 44 V68" stroke-dasharray="4 5"/>
    </g>
    <path d="M890 152 V184 H162"/>
    <g marker-end="url(#arrow)">
      <path d="M162 184 V216"/>
      <path d="M520 184 V216"/>
      <path d="M890 184 V216"/>
    </g>
  </g>
  <g fill="#1d2229" stroke="#39424e" stroke-width="1.3">
    <rect x="28"  y="68" width="204" height="84" rx="12"/>
    <rect x="282" y="68" width="204" height="84" rx="12"/>
    <rect x="536" y="68" width="204" height="84" rx="12"/>
    <rect x="790" y="68" width="204" height="84" rx="12" fill="#18342b" stroke="#396956"/>
    <rect x="28"  y="220" width="268" height="94" rx="12"/>
    <rect x="366" y="220" width="308" height="94" rx="12"/>
    <rect x="766" y="220" width="246" height="94" rx="12" fill="#18342b" stroke="#396956"/>
  </g>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <text x="636" y="26" fill="#a9b3bd" font-size="15">점검 건너뛰기</text>
    <g fill="#e4e9ef" font-size="22" font-weight="600">
      <text x="130" y="105">현장 참여</text>
      <text x="384" y="105">출근 저장</text>
      <text x="638" y="105">작업 전 점검</text>
      <text x="892" y="105" fill="#b8f0d7">근무 중</text>
      <text x="162" y="262">긴급 호출</text>
      <text x="520" y="262">위험 신고</text>
      <text x="889" y="262" fill="#b8f0d7">퇴근</text>
    </g>
    <g fill="#a9b3bd" font-size="16">
      <text x="130" y="133">로그인 · 현장 선택</text>
      <text x="384" y="133">현장 · 출근 시각</text>
      <text x="638" y="133">내 점검 · 동료 보호구</text>
      <text x="892" y="133">움직임 감시 · 안전 확인</text>
      <text x="162" y="292">충격 감지 또는 도움 요청</text>
      <text x="520" y="292">위험 발견 → 조치 → 재확인</text>
      <text x="889" y="292">근무 종료 → 기록 조회</text>
    </g>
  </g>
</svg>
