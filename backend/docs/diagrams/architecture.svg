    <text x="533" y="187" text-anchor="middle" fill="#aab3bf" font-size="13">내부 요청</text>
    <text x="808" y="137" text-anchor="middle" fill="#aab3bf" font-size="14">Drizzle</text>
    <rect x="36" y="112" width="180" height="90" rx="12" fill="#1d2229" stroke="#39424e" stroke-width="1.3"/>
    <text x="126" y="153" text-anchor="middle" fill="#e4e9ef" font-size="20" font-weight="500">작업자 앱</text>
    <text x="126" y="180" text-anchor="middle" fill="#e4e9ef" font-size="20" font-weight="500">관리자 웹</text>
    <rect x="326" y="112" width="170" height="90" rx="12" fill="#1d2229" stroke="#39424e" stroke-width="1.3"/>
    <text x="411" y="153" text-anchor="middle" fill="#e4e9ef" font-size="20" font-weight="500">Nginx</text>
