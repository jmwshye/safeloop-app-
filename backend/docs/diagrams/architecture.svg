    <rect x="570" y="112" width="188" height="90" rx="12" fill="#1d2229" stroke="#39424e" stroke-width="1.3"/>
    <text x="664" y="153" text-anchor="middle" fill="#e4e9ef" font-size="20" font-weight="500">NestJS API</text>
