    <text x="318" y="66" fill="#9ba4b1" font-size="14">AWS EC2 · 서울</text>
    <g fill="none" stroke="#697b8e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M216 157 H326" marker-start="url(#arrow)"/>
      <path d="M496 157 H570"/>
      <path d="M758 157 H858" marker-start="url(#arrow)"/>
      <path d="M411 230 V204"/>
    </g>
