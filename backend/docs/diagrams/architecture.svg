<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title description">
  <title id="title">앱·관리자 웹과 서버 연결 구조</title>
  <desc id="description">작업자 앱·관리자 웹 → Nginx → NestJS API. 데이터 기록: Drizzle → PostgreSQL. 앱 푸시: NestJS → FCM → 작업자 앱. HTTPS 인증서 갱신: Certbot.</desc>
