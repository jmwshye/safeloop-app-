e="20" font-weight="500">출근 저장</text><text x="747.5" y="173" text-anchor="middle" fill="#a9b3bd" font-size="14" font-weight="400">서버 성공 응답</text></g><g><rect x="925" y="108" width="163" height="84" rx="12" fill="#18342b" stroke="#396956" stroke-width="1.3"/><text x="1006.5" y="146" text-anchor="middle" fill="#b8f0d7" font-size="20" font-weight="500">출근 완료</text><text x="1006.5" y="173" text-anchor="middle" fill="#a9b3bd" font-size="14" font-weight="400">점검 단계로</text></g></g>
