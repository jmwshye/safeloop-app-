<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title description">
<title id="title">출근 흐름</title><desc id="description">오늘 출근 기록 없음 → 버튼으로 저장 → 저장 성공 응답 후 출근 완료 표시. 기존 기록 있음 → 기존 기록 사용.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#697b8e"/></marker></defs>
<rect width="1120" height="320" rx="18" fill="#101215"/>
