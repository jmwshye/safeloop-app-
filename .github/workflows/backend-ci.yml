name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend
        shell: bash

    env:
      TEST_DATABASE_URL: postgresql://safeloop_ci:safeloop_ci@127.0.0.1:5432/safeloop_ci_test

    services:
      postgres:
        image: postgres:18
        # 검사할 때만 생성되는 임시 DB의 접속 정보.
        env:
          POSTGRES_USER: safeloop_ci
          POSTGRES_PASSWORD: safeloop_ci
          POSTGRES_DB: safeloop_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeloop_ci -d safeloop_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: |
          : "${TEST_DATABASE_URL:?CI requires a test database}"
          npm test
