name: Build worker Android app
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 35 설치 (GitHub 서버에 설치된 도구 사용)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SafeLoop-Worker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: app/build/reports/tests/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screen-captures
          path: app/build/outputs/roborazzi/
